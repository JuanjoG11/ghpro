<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6c63ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GH Pro — Registro Asistencia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080d14;
      --card:     #0d1520;
      --border:   rgba(255,255,255,0.08);
      --glow:     rgba(58,130,200,0.45);
      --accent:   #3a82c8;
      --accent3:  #3aaa80;
      --danger:   #e05555;
      --warning:  #c87c3a;
      --text:     #e8f0fa;
      --muted:    #4a6080;
      --secondary:#8fa8c8;
      --radius:   16px;
      --radius-sm:10px;
      --transition: 0.2s ease;
    }

    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Fondo */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; }
    .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #ff6584; bottom: -80px; right: -80px; }

    /* Layout */
    .container {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 32px 16px env(safe-area-inset-bottom, 16px);
      gap: 0;
    }

    /* Header */
    .header { text-align: center; margin-bottom: 28px; }
    .header-logo { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .header-title { font-size: 26px; font-weight: 800; }
    .header-title span { color: var(--accent); }

    /* Hora */
    .hora-display {
      font-size: 48px; font-weight: 800; letter-spacing: 2px;
      font-variant-numeric: tabular-nums; margin-bottom: 4px;
    }
    .fecha-display { font-size: 13px; color: var(--muted); margin-bottom: 28px; text-align: center; }

    /* Card principal */
    .card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex; flex-direction: column; gap: 18px;
    }

    /* Toggle tipo */
    .tipo-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .tipo-btn {
      padding: 12px; border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      background: none; color: var(--muted);
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tipo-btn.active-entrada {
      border-color: var(--accent3); background: rgba(67,233,123,0.12); color: var(--accent3);
    }
    .tipo-btn.active-salida {
      border-color: var(--danger); background: rgba(255,71,87,0.12); color: var(--danger);
    }

    /* Cédula input */
    .cedula-label { font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }
    .cedula-input {
      width: 100%; font-size: 28px; text-align: center; letter-spacing: 6px;
      padding: 16px 12px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06); border: 2px solid var(--border);
      color: var(--text); transition: all var(--transition);
      -webkit-appearance: none;
    }
    .cedula-input:focus {
      outline: none; border-color: var(--glow);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
      background: rgba(255,255,255,0.09);
    }
    .cedula-input::placeholder { color: var(--muted); letter-spacing: 2px; font-size: 18px; }

    /* Tarjeta trabajador encontrado */
    .trabajador-card {
      display: none; align-items: center; gap: 14px;
      background: rgba(67,233,123,0.08); border: 1px solid rgba(67,233,123,0.3);
      border-radius: var(--radius-sm); padding: 14px 16px;
      animation: fadeSlide 0.25s ease;
    }
    .trabajador-card.show { display: flex; }
    .trabajador-card.not-found {
      background: rgba(255,71,87,0.08); border-color: rgba(255,71,87,0.3);
    }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .t-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; flex-shrink: 0; color: #fff;
    }
    .t-nombre { font-weight: 700; font-size: 15px; }
    .t-sub    { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* Botón principal */
    .btn-registrar {
      width: 100%; padding: 17px; border-radius: var(--radius-sm);
      border: none; cursor: pointer; font-size: 17px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #9c63ff);
      color: #fff; box-shadow: 0 4px 20px rgba(108,99,255,0.35);
      transition: all var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-registrar:hover  { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.5); }
    .btn-registrar:active { transform: translateY(0); }
    .btn-registrar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Separador */
    .separator {
      display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px;
    }
    .separator::before, .separator::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Aviso QR inválido / dispositivo bloqueado */
    .qr-bloqueado {
      width: 100%; max-width: 420px;
      background: rgba(224,85,85,0.1); border: 1px solid rgba(224,85,85,0.4);
      border-radius: var(--radius); padding: 32px 24px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .qr-bloqueado .icon { font-size: 48px; }
    .qr-bloqueado .titulo { font-size: 18px; font-weight: 800; color: var(--danger); }
    .qr-bloqueado .desc { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .qr-bloqueado.device {
      background: rgba(200,124,58,0.1); border-color: rgba(200,124,58,0.4);
    }
    .qr-bloqueado.device .titulo { color: var(--warning); }

    /* Toast */
    .toast-container {
      position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center;
      pointer-events: none;
    }
    .toast {
      background: #1a1a35; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 13px 20px; min-width: 260px; max-width: 340px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease; font-size: 14px;
      pointer-events: all;
    }
    .toast.success { border-left: 3px solid var(--accent3); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast.warning { border-left: 3px solid var(--warning); }
    .toast.info    { border-left: 3px solid var(--accent); }
    @keyframes toastIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    /* Historial reciente */
    .recientes-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .reciente-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
    }
    .reciente-item:last-child { border-bottom: none; }
    .rec-tipo {
      font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 700; flex-shrink: 0;
    }
    .rec-tipo.entrada { background: rgba(67,233,123,0.15); color: var(--accent3); }
    .rec-tipo.salida  { background: rgba(255,71,87,0.15);  color: var(--danger); }
    .rec-hora { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 40px; }
    .rec-nombre { flex: 1; color: var(--text); }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="container">

  <div class="header">
    <div class="header-logo">🏢 GH Pro</div>
    <div class="header-title">Marcar <span>Asistencia</span></div>
  </div>

  <div class="hora-display" id="horaDisplay">00:00</div>
  <div class="fecha-display" id="fechaDisplay"></div>

  <div class="card">

    <!-- Toggle Entrada / Salida -->
    <div class="tipo-toggle">
      <button class="tipo-btn active-entrada" id="btnEntrada" onclick="setTipo('entrada')">🟢 Entrada</button>
      <button class="tipo-btn"               id="btnSalida"  onclick="setTipo('salida')">🔴 Salida</button>
    </div>

    <!-- Input cédula -->
    <div style="display:flex;flex-direction:column;gap:6px" id="cedulaSection">
      <label class="cedula-label" for="cedulaInput">Número de cédula</label>
      <input
        type="tel" id="cedulaInput"
        class="cedula-input"
        placeholder="Ej: 1088253407"
        maxlength="12" autocomplete="off" inputmode="numeric"
        oninput="onCedula(this.value)"
        onkeydown="if(event.key==='Enter') continuar()"
      />
    </div>

    <!-- Tarjeta trabajador -->
    <div class="trabajador-card" id="trabajadorCard">
      <div class="t-avatar" id="tAvatar"></div>
      <div>
        <div class="t-nombre" id="tNombre"></div>
        <div class="t-sub"    id="tSub"></div>
      </div>
    </div>

    <!-- Botón Registrar -->
    <button class="btn-registrar" id="btnContinuar" onclick="continuar()" disabled>
      ✅ Registrar Asistencia
    </button>

    <!-- Historial reciente del día -->
    <div id="recientesWrap" style="display:none">
      <div class="recientes-title" style="margin-bottom:10px">Últimos registros de hoy</div>
      <div id="recientesList"></div>
    </div>

  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
'use strict';

// ── Supabase ─────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://rvosdhqidjqxzcbcdgzl.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2b3NkaHFpZGpxeHpjYmNkZ3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzYwMjYsImV4cCI6MjEwMjkxMjAyNn0.CI2G80McLHoINOvAhrFT5t5ft7WX4H-H1BwdfPD--EM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Estado ───────────────────────────────────────────────────────
const State = {
  tipo:         'entrada',
  trabajador:   null,
  trabajadores: [],
};

// ── Cache en memoria (reduce queries a Supabase) ─────────────────
// Guarda resultados por máximo TTL milisegundos, luego vuelve a consultar
const QueryCache = {
  _store: {},
  get(key) {
    const entry = this._store[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > entry.ttl) { delete this._store[key]; return null; }
    return entry.value;
  },
  set(key, value, ttl = 8000) {
    this._store[key] = { value, ts: Date.now(), ttl };
  },
  invalidate(key) {
    if (key) delete this._store[key];
    else this._store = {};
  },
};

// ── Helpers ──────────────────────────────────────────────────────
// today() usa la fecha LOCAL del dispositivo (no UTC) para evitar desfase en Colombia (UTC-5)
const today = () => {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
};
const horaActual = () => new Date().toTimeString().slice(0, 8);
const fmtHora    = h  => h ? h.slice(0, 5) : '—';

const AVATAR_COLORS = ['#6c63ff','#ff6584','#43e97b','#f7971e','#1e90ff','#ff9f43'];
const avatarColor   = s => AVATAR_COLORS[(s || '').charCodeAt(0) % AVATAR_COLORS.length];

function toast(msg, type = 'success', ms = 3500) {
  const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => {
    el.style.transition = '0.3s'; el.style.opacity = '0'; el.style.transform = 'translateY(16px)';
    setTimeout(() => el.remove(), 320);
  }, ms);
}

// ── Reloj ────────────────────────────────────────────────────────
function actualizarReloj() {
  const now = new Date();
  const h   = document.getElementById('horaDisplay');
  const f   = document.getElementById('fechaDisplay');
  if (h) h.textContent = now.toTimeString().slice(0, 5);
  if (f) {
    const s = now.toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    f.textContent = s.charAt(0).toUpperCase() + s.slice(1);
  }
}

// ── Hash Rápido (cyrb53) para huella digital ──────────────────────
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

// ── Huella digital del dispositivo/navegador (Anti-trampas) ───────
// Permite reconocer el mismo teléfono físico incluso si abren pestaña privada
function getDeviceFingerprint() {
  try {
    const parts = [
      navigator.userAgent || '',
      navigator.language || '',
      screen.width + 'x' + screen.height + 'x' + (screen.colorDepth || 24),
      window.devicePixelRatio || 1,
      navigator.hardwareConcurrency || 'na',
      navigator.maxTouchPoints || 0,
      Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    ];
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 150; canvas.height = 30;
      const ctx = canvas.getContext('2d');
      if (ctx) {
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(10, 5, 60, 20);
        ctx.fillStyle = '#069';
        ctx.fillText('GH-PRO-FP', 12, 10);
        parts.push(canvas.toDataURL());
      }
    } catch (_) {}
    return cyrb53(parts.join('|||'));
  } catch (_) {
    return 'fp_' + Math.random().toString(36).slice(2, 10);
  }
}

// ── Almacenamiento persistente multi-capa ─────────────────────────
function getStoredDeviceId() {
  const KEY = 'ghpro_device_id';
  let id = null;
  try { id = localStorage.getItem(KEY); } catch (_) {}
  if (!id) {
    const match = document.cookie.match(new RegExp('(^|;\\s*)' + KEY + '=([^;]+)'));
    if (match) id = decodeURIComponent(match[2]);
  }
  if (!id) {
    try { id = sessionStorage.getItem(KEY); } catch (_) {}
  }
  return id;
}

function persistDeviceId(id) {
  const KEY = 'ghpro_device_id';
  try { localStorage.setItem(KEY, id); } catch (_) {}
  try { sessionStorage.setItem(KEY, id); } catch (_) {}
  try {
    document.cookie = `${KEY}=${encodeURIComponent(id)}; max-age=31536000; path=/; SameSite=Lax`;
  } catch (_) {}
}

// ── Identificador de dispositivo unificado ─────────────────────────
async function getDeviceId() {
  let stored = getStoredDeviceId();
  const fp = getDeviceFingerprint();

  if (stored) {
    persistDeviceId(stored);
    return stored;
  }

  // Si es una pestaña de incógnito o borraron caché, recuperar si hoy ya hay registro con este fingerprint
  try {
    const { data } = await sb
      .from('asistencia')
      .select('device_id')
      .eq('fecha', today())
      .like('device_id', `fp_${fp}_%`)
      .limit(1);

    if (data && data.length > 0 && data[0].device_id) {
      const recoveredId = data[0].device_id;
      persistDeviceId(recoveredId);
      return recoveredId;
    }
  } catch (_) {}

  const randomPart = 'xxxxxxxxxxxx'.replace(/[x]/g, () => (Math.random() * 16 | 0).toString(16));
  const newId = `fp_${fp}_${randomPart}`;
  persistDeviceId(newId);
  return newId;
}

// ── Consulta de registros del dispositivo hoy ─────────────────────
// Retorna { count, tipos, tieneEntrada, tieneSalida, registros, offline }
// IMPORTANTE: si hay error de red retorna offline:true para bloquear el registro
async function verificarDispositivoHoy() {
  const deviceId = await getDeviceId();
  const fp = getDeviceFingerprint();
  const cacheKey = `device_${today()}`;

  const cached = QueryCache.get(cacheKey);
  if (cached) return cached;

  const { data, error } = await sb
    .from('asistencia')
    .select('id, tipo, hora, trabajador_nombre, cedula, device_id')
    .eq('fecha', today())
    .or(`device_id.eq.${deviceId},device_id.like.fp_${fp}_%`);

  // Si hay error de red o Supabase no responde, NO permitir registro
  // Retornar offline:true para que el llamador lo maneje
  if (error || data === null) {
    return { count: 0, tipos: [], tieneEntrada: false, tieneSalida: false, registros: [], offline: true };
  }

  const result = {
    count: data.length,
    tipos: data.map(r => r.tipo),
    tieneEntrada: data.some(r => r.tipo === 'entrada'),
    tieneSalida: data.some(r => r.tipo === 'salida'),
    registros: data,
    offline: false,
  };

  // Cachear 8 segundos — suficiente para evitar queries duplicadas en el mismo flujo
  QueryCache.set(cacheKey, result, 8000);
  return result;
}

// ── Toggle tipo (Entrada / Salida) ───────────────────────────────
async function setTipo(tipo) {
  State.tipo = tipo;
  const be = document.getElementById('btnEntrada');
  const bs = document.getElementById('btnSalida');
  if (be) be.className = 'tipo-btn' + (tipo === 'entrada' ? ' active-entrada' : '');
  if (bs) bs.className = 'tipo-btn' + (tipo === 'salida'  ? ' active-salida'  : '');

  // Validar si el dispositivo ya utilizó este tipo hoy
  if (State.trabajador) {
    await actualizarBotonPorEstado();
  }
}

// ── Actualiza el botón y estado según el trabajador y el dispositivo ──
async function actualizarBotonPorEstado() {
  const btn = document.getElementById('btnContinuar');
  const t   = State.trabajador;
  if (!t) {
    btn.disabled  = true;
    btn.innerHTML = '✅ Registrar Asistencia';
    return;
  }

  const device = await verificarDispositivoHoy();

  // 0. Sin conexión: no se puede verificar nada, bloquear por seguridad
  if (device.offline) {
    btn.disabled  = true;
    btn.innerHTML = '📡 Sin conexión — reintenta';
    return;
  }

  // 1. Si el dispositivo ya llegó al límite absoluto de 2 registros
  if (device.count >= 2) {
    btn.disabled  = true;
    btn.innerHTML = '📵 Límite de dispositivo alcanzado';
    return;
  }

  // 2. Si el dispositivo ya registró el tipo seleccionado
  if (State.tipo === 'entrada' && device.tieneEntrada) {
    btn.disabled  = true;
    btn.innerHTML = '⚠️ Este celular ya marcó Entrada hoy';
    return;
  }
  if (State.tipo === 'salida' && device.tieneSalida) {
    btn.disabled  = true;
    btn.innerHTML = '⚠️ Este celular ya marcó Salida hoy';
    return;
  }

  // 3. Consultar estado del trabajador (con cache 10s)
  const cacheKeyBtn = `cedula_${t.cedula}_${today()}`;
  let registrosHoyBtn = QueryCache.get(cacheKeyBtn);
  if (!registrosHoyBtn) {
    const { data: hoy } = await sb
      .from('asistencia')
      .select('tipo, hora')
      .eq('cedula', t.cedula)
      .eq('fecha', today())
      .order('hora', { ascending: false });
    registrosHoyBtn = hoy || [];
    QueryCache.set(cacheKeyBtn, registrosHoyBtn, 10000);
  }
  const registrosHoy  = registrosHoyBtn;
  const tieneEntrada  = registrosHoy.some(r => r.tipo === 'entrada');
  const tieneSalida   = registrosHoy.some(r => r.tipo === 'salida');

  if (tieneEntrada && tieneSalida) {
    btn.disabled  = true;
    btn.innerHTML = '🔒 Jornada completada hoy';
    return;
  }

  if (State.tipo === 'entrada' && tieneEntrada) {
    btn.disabled  = true;
    btn.innerHTML = '⚠️ Trabajador ya registró Entrada';
    return;
  }

  if (State.tipo === 'salida' && tieneSalida) {
    btn.disabled  = true;
    btn.innerHTML = '⚠️ Trabajador ya registró Salida';
    return;
  }

  btn.disabled  = false;
  btn.innerHTML = State.tipo === 'entrada' ? '🟢 Registrar Entrada' : '🔴 Registrar Salida';
}

// ── Búsqueda cédula en tiempo real ───────────────────────────────
async function onCedula(val) {
  const cedula = val.trim();
  const card   = document.getElementById('trabajadorCard');
  const btn    = document.getElementById('btnContinuar');

  if (cedula.length < 4) {
    card.className   = 'trabajador-card';
    State.trabajador = null;
    btn.disabled     = true;
    btn.innerHTML    = '✅ Registrar Asistencia';
    return;
  }

  const t = State.trabajadores.find(w => w.cedula === cedula);
  if (t) {
    State.trabajador = t;
    document.getElementById('tAvatar').style.background = avatarColor(t.nombre);
    document.getElementById('tAvatar').textContent      = t.nombre.charAt(0).toUpperCase();
    document.getElementById('tNombre').textContent      = t.nombre;

    // Consultar registros de hoy para este trabajador (con cache 10s)
    const cacheKeyCedula = `cedula_${cedula}_${today()}`;
    let registrosHoy = QueryCache.get(cacheKeyCedula);
    if (!registrosHoy) {
      const { data: hoy } = await sb
        .from('asistencia')
        .select('tipo, hora')
        .eq('cedula', cedula)
        .eq('fecha', today())
        .order('hora', { ascending: false });
      registrosHoy = hoy || [];
      QueryCache.set(cacheKeyCedula, registrosHoy, 10000);
    }
    const ultimoEntrada = registrosHoy.find(r => r.tipo === 'entrada');
    const ultimaSalida  = registrosHoy.find(r => r.tipo === 'salida');

    // Estado descriptivo
    let estadoTexto = [t.cargo, t.ciudad].filter(Boolean).join(' · ');
    let estadoExtra = '';
    if (registrosHoy.length > 0) {
      const partes = [];
      if (ultimoEntrada) partes.push(`🟢 Entrada: ${fmtHora(ultimoEntrada.hora)}`);
      if (ultimaSalida)  partes.push(`🔴 Salida: ${fmtHora(ultimaSalida.hora)}`);
      estadoExtra = partes.join('  ·  ');
    }
    document.getElementById('tSub').innerHTML = estadoTexto +
      (estadoExtra ? `<br><span style="font-size:11px;color:var(--accent3)">${estadoExtra}</span>` : '');

    // Sugerir tipo automáticamente según lo que falta
    const device = await verificarDispositivoHoy();
    if (ultimoEntrada && !ultimaSalida) {
      setTipo('salida');
    } else if (!ultimoEntrada) {
      setTipo('entrada');
    } else {
      setTipo('entrada');
    }

    card.className = 'trabajador-card show';
    await actualizarBotonPorEstado();
  } else {
    State.trabajador = null;
    document.getElementById('tNombre').textContent = `Cédula ${cedula} no registrada`;
    document.getElementById('tSub').textContent    = 'Verifica el número ingresado';
    document.getElementById('tAvatar').textContent = '❓';
    document.getElementById('tAvatar').style.background = '#333';
    card.className = 'trabajador-card show not-found';
    btn.disabled   = true;
    btn.innerHTML  = '✅ Registrar Asistencia';
  }
}

// ── Continuar: registrar directamente ─────────────────────────────
async function continuar() {
  if (!State.trabajador) return;
  await registrar('qr');
}

// ── Registrar asistencia ─────────────────────────────────────────
async function registrar(metodo = 'qr') {
  if (!State.trabajador) return toast('Ingresa tu número de cédula', 'warning');

  const t        = State.trabajador;
  const fechaHoy = today();
  const hora     = horaActual();
  const tipo     = State.tipo;

  const btn = document.getElementById('btnContinuar');
  btn.disabled = true;

  // ── Verificación estricta del dispositivo (Anti-trampas) ────────
  const device = await verificarDispositivoHoy();

  // Regla 0: Sin conexión — no permitir registro (evita bypass por red caída)
  if (device.offline) {
    toast('📡 Sin conexión a internet. Verifica tu señal e intenta de nuevo.', 'error', 6000);
    btn.disabled = false;
    await actualizarBotonPorEstado();
    return;
  }

  // Regla 1: Máximo 2 registros totales por día por dispositivo
  if (device.count >= 2) {
    mostrarBloqueo(
      'Límite de dispositivo alcanzado',
      'Este dispositivo ya completó sus 2 registros diarios (entrada y salida). No se permiten más registros desde este teléfono.',
      'device'
    );
    return;
  }

  // Regla 2: Solo 1 entrada por día por dispositivo
  if (tipo === 'entrada' && device.tieneEntrada) {
    toast('⛔ Este dispositivo ya registró una Entrada hoy. No se permite marcar entrada para otro trabajador.', 'error', 6000);
    await actualizarBotonPorEstado();
    return;
  }

  // Regla 3: Solo 1 salida por día por dispositivo
  if (tipo === 'salida' && device.tieneSalida) {
    toast('⛔ Este dispositivo ya registró una Salida hoy.', 'error', 6000);
    await actualizarBotonPorEstado();
    return;
  }

  // Regla 4: Verificación del trabajador en la base de datos
  const { data: trabajadorHoy } = await sb
    .from('asistencia')
    .select('id, hora, tipo')
    .eq('cedula', t.cedula)
    .eq('fecha', fechaHoy)
    .eq('tipo', tipo);

  if (trabajadorHoy && trabajadorHoy.length > 0) {
    const yaHora = fmtHora(trabajadorHoy[0].hora);
    toast(`⚠️ Esta cédula ya tiene una ${tipo} registrada hoy a las ${yaHora}.`, 'warning', 5000);
    await actualizarBotonPorEstado();
    return;
  }

  const deviceId = await getDeviceId();
  const row = {
    trabajador_id:     t.id,
    trabajador_nombre: t.nombre,
    cedula:            t.cedula,
    cargo:             t.cargo  || '',
    ciudad:            t.ciudad || '',
    tipo,
    fecha:             fechaHoy,
    hora,
    metodo,
    device_id:         deviceId,
  };

  toast('Guardando registro...', 'info', 1500);

  const { error } = await sb.from('asistencia').insert([row]);

  if (error) {
    // Error 23505 = duplicate key: la constraint de la DB detectó un duplicado
    // (dos taps simultáneos, etc.). Tratarlo como si ya estuviera registrado.
    if (error.code === '23505') {
      toast(`⚠️ Esta ${tipo} ya fue registrada hoy para esta cédula.`, 'warning', 5000);
    } else {
      toast('❌ Error al guardar: ' + error.message, 'error', 6000);
    }
    btn.disabled = false;
    await actualizarBotonPorEstado();
    return;
  }

  // Invalidar cache para que los datos se refresquen en el próximo uso
  QueryCache.invalidate();

  const emoji = tipo === 'entrada' ? '🟢' : '🔴';
  toast(`${emoji} ${tipo.charAt(0).toUpperCase()+tipo.slice(1)} registrada correctamente — ${t.nombre}`, 'success', 5000);

  await cargarRecientes(t.cedula);

  // Si este registro completó los 2 permitidos para este dispositivo (ej. completó salida)
  if (device.count + 1 >= 2) {
    setTimeout(() => {
      mostrarBloqueo(
        'Jornada registrada',
        `¡Has completado tus 2 registros de hoy (Entrada y Salida)! Este dispositivo queda bloqueado hasta el próximo día.`,
        'device'
      );
    }, 2500);
    return;
  }

  resetearFormulario();
}

// ── Resetear formulario al estado inicial ────────────────────────
function resetearFormulario() {
  document.getElementById('cedulaInput').value = '';
  document.getElementById('trabajadorCard').className = 'trabajador-card';
  document.getElementById('btnContinuar').disabled    = true;
  document.getElementById('btnContinuar').innerHTML   = '✅ Registrar Asistencia';
  State.trabajador = null;
  setTipo('entrada');
  setTimeout(() => document.getElementById('cedulaInput').focus(), 300);
}

// ── Recientes del trabajador que acaba de registrar ──────────────
async function cargarRecientes(cedula) {
  const wrap  = document.getElementById('recientesWrap');
  const lista = document.getElementById('recientesList');
  if (!cedula) { if (wrap) wrap.style.display = 'none'; return; }

  const { data } = await sb
    .from('asistencia')
    .select('trabajador_nombre, tipo, hora')
    .eq('cedula', cedula)
    .eq('fecha', today())
    .order('hora', { ascending: false })
    .limit(5);

  if (!data || !data.length) { if (wrap) wrap.style.display = 'none'; return; }
  if (wrap) wrap.style.display = '';
  if (lista) {
    lista.innerHTML = data.map(r => `
      <div class="reciente-item">
        <span class="rec-hora">${fmtHora(r.hora)}</span>
        <span class="rec-tipo ${r.tipo}">${r.tipo}</span>
        <span class="rec-nombre">${r.trabajador_nombre}</span>
      </div>`).join('');
  }

  setTimeout(() => { if (wrap) wrap.style.display = 'none'; }, 8000);
}

// ── Validar ?qr= al abrir la página ─────────────────────────────
function revisarQRenURL() {
  const params = new URLSearchParams(location.search);
  const qr     = params.get('qr');

  if (!qr) {
    mostrarBloqueo('Acceso no autorizado', 'Debes escanear el código QR de la pantalla principal para registrar tu asistencia.');
    return;
  }

  const ventanaActual = Math.floor(Date.now() / 30000);
  let valido = false;
  try {
    const obj = JSON.parse(atob(decodeURIComponent(qr)));
    valido = obj.app === 'ghpro-asist' && Math.abs(obj.w - ventanaActual) <= 1;
  } catch (_) {}

  if (!valido) {
    mostrarBloqueo('QR expirado', 'El código QR escaneado ya no es válido. Vuelve a escanear el código que aparece en la pantalla principal.');
    return;
  }

  history.replaceState({}, '', location.pathname);
  toast('QR válido — ingresa tu cédula', 'info', 4000);
}

function mostrarBloqueo(titulo, desc, tipo = '') {
  const card = document.querySelector('.card');
  const hora = document.getElementById('horaDisplay');
  const fecha = document.getElementById('fechaDisplay');
  if (card) card.style.display = 'none';
  if (hora) hora.style.display  = 'none';
  if (fecha) fecha.style.display = 'none';

  const icono = tipo === 'device' ? '📵' : '🔒';

  // Remover bloque previo si existe
  const previo = document.querySelector('.qr-bloqueado');
  if (previo) previo.remove();

  const bloqueo = document.createElement('div');
  bloqueo.className = 'qr-bloqueado' + (tipo ? ' ' + tipo : '');
  bloqueo.innerHTML = `
    <div class="icon">${icono}</div>
    <div class="titulo">${titulo}</div>
    <div class="desc">${desc}</div>
  `;
  document.querySelector('.container').appendChild(bloqueo);
}

// ── Init ─────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  // 1. Validar QR antes de mostrar el formulario
  revisarQRenURL();

  // 2. Verificar si este dispositivo ya alcanzó el límite de hoy (2 registros)
  const device = await verificarDispositivoHoy();
  if (device.offline) {
    // Red caída al arrancar — mostrar aviso pero dejar cargar el formulario
    // El bloqueo real ocurrirá al intentar registrar
    toast('⚠️ Sin conexión al servidor. Verifica tu señal antes de registrar.', 'warning', 8000);
  } else if (device.count >= 2) {
    mostrarBloqueo(
      'Límite de dispositivo alcanzado',
      'Este dispositivo ya completó sus 2 registros diarios (entrada y salida). No se permiten más registros desde este teléfono hoy.',
      'device'
    );
    return;
  }

  // 3. Cargar trabajadores desde Supabase
  const { data, error: errTrab } = await sb.from('trabajadores').select('id,nombre,cedula,cargo,ciudad').order('nombre');
  if (errTrab || !data) {
    toast('❌ Error al cargar la lista de trabajadores. Verifica tu conexión y recarga la página.', 'error', 0);
    return;
  }
  State.trabajadores = data;

  const input = document.getElementById('cedulaInput');
  if (input) input.focus();
});
</script>
