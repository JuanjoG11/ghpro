<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GH Pro — Pantalla QR Asistencia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a1a;
      --card:    #12122a;
      --border:  rgba(108,99,255,0.35);
      --accent:  #6c63ff;
      --accent3: #43e97b;
      --text:    #f0f0ff;
      --muted:   #7070a0;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.25; }
    .orb-1 { width: 500px; height: 500px; background: var(--accent);  top: -120px; left: -120px; animation: drift 14s ease-in-out infinite alternate; }
    .orb-2 { width: 400px; height: 400px; background: #ff6584;        bottom: -100px; right: -100px; animation: drift 18s ease-in-out infinite alternate-reverse; }
    .orb-3 { width: 300px; height: 300px; background: var(--accent3); top: 40%; left: 40%; animation: drift 10s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }

    .screen {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px; padding: 28px;
    }

    .header { text-align: center; }
    .header-logo  { font-size: 18px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
    .header-title { font-size: clamp(24px, 3.5vw, 42px); font-weight: 800; }
    .header-title span { color: var(--accent); }
    .header-sub   { font-size: clamp(13px, 1.6vw, 18px); color: var(--muted); margin-top: 6px; }

    .qr-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 28px;
      padding: clamp(20px, 3vw, 40px);
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      box-shadow: 0 0 60px rgba(108,99,255,0.2);
      animation: cardPulse 4s ease-in-out infinite;
    }
    @keyframes cardPulse {
      0%,100% { box-shadow: 0 0 60px rgba(108,99,255,0.2); }
      50%      { box-shadow: 0 0 90px rgba(108,99,255,0.4); }
    }

    /* Contenedor QR — tamaño fijo y explícito */
    .qr-wrap {
      position: relative;
      width:  280px;
      height: 280px;
      background: #fff;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      padding: 10px;
    }
    .qr-wrap::before {
      content: '';
      position: absolute; inset: -5px;
      border-radius: 22px;
      border: 3px solid var(--accent);
      animation: ringPulse 2s ease-in-out infinite;
    }
    @keyframes ringPulse {
      0%,100% { opacity: 1;   box-shadow: 0 0 0 0   rgba(108,99,255,0.5); }
      50%      { opacity: 0.7; box-shadow: 0 0 0 10px rgba(108,99,255,0); }
    }

    /* La imagen QR ocupa todo el contenedor */
    #qrImg {
      width:  260px;
      height: 260px;
      border-radius: 10px;
      display: block;
      background: #fff;
    }

    /* Spinner mientras carga */
    .qr-spinner {
      position: absolute;
      font-size: 32px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .countdown-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;
    }
    .countdown-label {
      font-size: clamp(12px, 1.4vw, 15px); color: var(--muted);
      display: flex; justify-content: space-between; width: 100%;
    }
    .countdown-secs { color: var(--accent); font-weight: 700; }
    .progress-bar   { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width 1s linear; }

    .instruction {
      text-align: center; font-size: clamp(13px, 1.6vw, 18px);
      color: var(--muted); max-width: 420px; line-height: 1.6;
    }
    .instruction strong { color: var(--text); }

    .clock {
      font-size: clamp(28px, 5vw, 64px); font-weight: 800;
      font-variant-numeric: tabular-nums; letter-spacing: 3px; color: var(--text);
    }
    .clock-date { font-size: clamp(12px, 1.4vw, 16px); color: var(--muted); text-align: center; margin-top: -16px; }

    /* Botón pantalla completa */
    .fullscreen-btn {
      position: fixed; top: 18px; right: 18px; z-index: 200;
      background: var(--accent); border: none; color: #fff;
      border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 20px rgba(108,99,255,0.5);
      transition: background 0.2s, transform 0.15s, opacity 0.5s;
    }
    .fullscreen-btn:hover  { background: #8076ff; transform: scale(1.05); }
    .fullscreen-btn.fs-active { opacity: 0; pointer-events: none; }
    body:hover .fullscreen-btn.fs-active { opacity: 1; pointer-events: auto; }

    .recent-flash {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(67,233,123,0.15); border: 1px solid rgba(67,233,123,0.4);
      border-radius: 14px; padding: 14px 28px;
      display: flex; align-items: center; gap: 14px;
      font-size: clamp(13px, 1.5vw, 17px); font-weight: 600;
      opacity: 0; transition: opacity 0.4s ease;
      pointer-events: none; z-index: 10; white-space: nowrap;
    }
    .recent-flash.show   { opacity: 1; }
    .recent-flash.salida { background: rgba(255,71,87,0.15); border-color: rgba(255,71,87,0.4); }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<button class="fullscreen-btn" id="fsBtn" onclick="toggleFullscreen()">
  <span id="fsIcon">⛶</span>
  <span id="fsLabel">Pantalla completa</span>
</button>

<div class="screen">
  <div class="header">
    <div class="header-logo">🏢 GH Pro</div>
    <div class="header-title">Registro de <span>Asistencia</span></div>
    <div class="header-sub">Escanea el código con tu celular para marcar entrada o salida</div>
  </div>

  <div class="clock" id="clockDisplay">00:00:00</div>
  <div class="clock-date" id="clockDate"></div>

  <div class="qr-card">
    <div class="qr-wrap" id="qrWrap">
      <div class="qr-spinner" id="qrSpinner">⏳</div>
      <img id="qrImg" alt="QR" style="display:none" />
    </div>
    <div class="countdown-wrap">
      <div class="countdown-label">
        <span>Código válido por</span>
        <span class="countdown-secs"><span id="countSecs">30</span>s</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:100%"></div>
      </div>
    </div>
  </div>

  <div class="instruction">
    <strong>¿Cómo registrar?</strong><br>
    Escanea este QR con tu celular o abre el link de registro.<br>
    Ingresa tu cédula y confirma tu asistencia.
  </div>
</div>

<div class="recent-flash" id="recentFlash">
  <span id="recentIcon">🟢</span>
  <span id="recentText">—</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';

// ── Supabase ─────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://rvosdhqidjqxzcbcdgzl.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2b3NkaHFpZGpxeHpjYmNkZ3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzYwMjYsImV4cCI6MjEwMjkxMjAyNn0.CI2G80McLHoINOvAhrFT5t5ft7WX4H-H1BwdfPD--EM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Token QR (ventana de 30 s) ────────────────────────────────────
function generarToken() {
  const w = Math.floor(Date.now() / 30000);
  return btoa(JSON.stringify({ app: 'ghpro-asist', w }));
}

// ── URL de destino del QR ─────────────────────────────────────────
function getLoginUrl() {
  const token = generarToken();
  const base  = location.href.replace('asistencia-qr.html', 'asistencia-login.html');
  return base + '?qr=' + encodeURIComponent(token);
}

// ── Dibujar QR usando API externa (sin canvas, sin librería local) ─
// qrserver.com es una API REST gratuita y confiable.
// Solo necesita que el TV tenga acceso a internet.
let secsLeft  = 30;
let qrLoading = false;

function dibujarQR() {
  if (qrLoading) return;
  qrLoading = true;

  const img     = document.getElementById('qrImg');
  const spinner = document.getElementById('qrSpinner');
  const loginUrl = getLoginUrl();

  // Mostramos el spinner mientras carga
  if (spinner) spinner.style.display = 'block';
  if (img)     img.style.display     = 'none';

  const qrApiUrl =
    'https://api.qrserver.com/v1/create-qr-code/' +
    '?size=260x260' +
    '&data='    + encodeURIComponent(loginUrl) +
    '&bgcolor=ffffff' +
    '&color=0a0a1a' +
    '&margin=2' +
    '&ecc=M' +
    '&t=' + Date.now(); // evitar caché del TV

  if (!img) { qrLoading = false; return; }

  img.onload = function () {
    if (spinner) spinner.style.display = 'none';
    img.style.display = 'block';
    qrLoading = false;
  };

  img.onerror = function () {
    // Si la API externa falla, intentar con Google Charts
    img.onerror = function () {
      // Si Google también falla, mostrar texto de fallback
      if (spinner) spinner.textContent = '❌ Sin internet';
      qrLoading = false;
    };
    img.src =
      'https://chart.googleapis.com/chart' +
      '?cht=qr' +
      '&chs=260x260' +
      '&chl=' + encodeURIComponent(loginUrl) +
      '&choe=UTF-8';
  };

  img.src = qrApiUrl;
}

// ── Countdown ─────────────────────────────────────────────────────
let secsInterval = null;

function tick() {
  secsLeft--;
  const fill = document.getElementById('progressFill');
  const secs = document.getElementById('countSecs');
  if (fill) fill.style.width = (secsLeft / 30 * 100) + '%';
  if (secs) secs.textContent = secsLeft;

  if (secsLeft <= 0) {
    secsLeft = 30;
    dibujarQR();
  }
}

// ── Reloj ─────────────────────────────────────────────────────────
function actualizarReloj() {
  const now   = new Date();
  const hora  = now.toTimeString().slice(0, 8);
  const fecha = now.toLocaleDateString('es-CO', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
  });
  const clockEl = document.getElementById('clockDisplay');
  const dateEl  = document.getElementById('clockDate');
  if (clockEl) clockEl.textContent = hora;
  if (dateEl)  dateEl.textContent  = fecha.charAt(0).toUpperCase() + fecha.slice(1);
}

// ── Flash registro reciente ───────────────────────────────────────
let flashTimeout = null;

function mostrarFlash(nombre, tipo) {
  const flash = document.getElementById('recentFlash');
  const icon  = document.getElementById('recentIcon');
  const text  = document.getElementById('recentText');
  if (!flash) return;
  flash.classList.remove('show', 'salida');
  void flash.offsetWidth;
  icon.textContent = tipo === 'entrada' ? '🟢' : '🔴';
  text.textContent = (tipo === 'entrada' ? 'Entrada' : 'Salida') + ': ' + nombre;
  if (tipo === 'salida') flash.classList.add('salida');
  flash.classList.add('show');
  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(() => flash.classList.remove('show'), 5000);
}

// ── Realtime Supabase ─────────────────────────────────────────────
function suscribirRegistros() {
  sb.channel('asistencia-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'asistencia' }, function(payload) {
      const r = payload.new;
      mostrarFlash(r.trabajador_nombre, r.tipo);
      secsLeft = 0; // renovar QR inmediatamente
    })
    .subscribe();
}

// ── Pantalla completa ─────────────────────────────────────────────
function toggleFullscreen() {
  const el   = document.documentElement;
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  if (!isFs) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen || function(){}).call(document);
  }
}

function onFsChange() {
  const btn   = document.getElementById('fsBtn');
  const icon  = document.getElementById('fsIcon');
  const label = document.getElementById('fsLabel');
  const isFs  = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  if (isFs) {
    icon.textContent  = '✕';
    label.textContent = 'Salir fullscreen';
    btn.classList.add('fs-active');
  } else {
    icon.textContent  = '⛶';
    label.textContent = 'Pantalla completa';
    btn.classList.remove('fs-active');
  }
}
document.addEventListener('fullscreenchange',       onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('mozfullscreenchange',    onFsChange);

// ── Init ──────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  actualizarReloj();
  dibujarQR();
  setInterval(tick, 1000);
  setInterval(actualizarReloj, 1000);
  suscribirRegistros();
});
</script>
</body>
</html>
