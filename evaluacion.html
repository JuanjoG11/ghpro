<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GH PRO — Evaluación de Desempeño</title>
  <style>
    /* ── Reset y base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a2332;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────── */
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .top-bar {
      background: #1a2332;
      color: #fff;
      padding: 0 1.25rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: .5px; }
    .top-bar .modulo { font-size: .85rem; opacity: .7; }
    .top-bar .spacer { flex: 1; }

    .main-layout { display: flex; flex: 1; }
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      padding: 1rem .75rem;
      display: flex;
      flex-direction: column;
      gap: .25rem;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .sidebar .nav-label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #94a3b8;
      margin: .75rem 0 .25rem .5rem;
    }
    .sidebar .nav-btn {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem .75rem;
      border-radius: 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: .88rem;
      color: #334155;
      text-align: left;
      width: 100%;
      transition: background .15s;
    }
    .sidebar .nav-btn:hover, .sidebar .nav-btn.active { background: #e0f2fe; color: #0369a1; }

    .content { flex: 1; padding: 1.5rem; overflow-y: auto; }

    /* ── Tarjetas y tablas ───────────────────────────── */
    .tabla-gh {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .tabla-gh th {
      background: #f8fafc;
      padding: .65rem 1rem;
      text-align: left;
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
    }
    .tabla-gh td {
      padding: .75rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    .tabla-gh tr:last-child td { border-bottom: none; }
    .tabla-gh tr.fila-alerta td { background: #fff7ed; }
    .tabla-gh tr.fila-brecha td { background: #fff5f5; }
    .tabla-gh tr:hover td { background: #f8fafc; }
    .table-responsive { overflow-x: auto; border-radius: 10px; }

    /* ── Badges ──────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: .2em .65em;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-success  { background: #dcfce7; color: #166534; }
    .badge-warning  { background: #fef9c3; color: #854d0e; }
    .badge-danger   { background: #fee2e2; color: #991b1b; }
    .badge-info     { background: #dbeafe; color: #1e40af; }
    .badge-primary  { background: #ede9fe; color: #5b21b6; }
    .badge-neutral  { background: #f1f5f9; color: #475569; }
    .badge-lg       { font-size: .9rem; padding: .3em 1em; }

    /* ── Botones ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .5rem 1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: .88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary  { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success  { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-danger   { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary{ background: #f1f5f9; color: #334155; border-color: #e2e8f0; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-ghost    { background: transparent; color: #64748b; }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-sm  { padding: .35rem .75rem; font-size: .82rem; }
    .btn-xs  { padding: .2rem .5rem; font-size: .78rem; border-radius: 6px; }
    .btn-lg  { padding: .65rem 1.5rem; font-size: .95rem; }

    /* ── Formularios ─────────────────────────────────── */
    .form-control {
      width: 100%;
      padding: .45rem .75rem;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: .88rem;
      color: #1a2332;
      background: #fff;
      transition: border .15s;
    }
    .form-control:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .form-control[readonly] { background: #f8fafc; color: #64748b; }
    .form-select { appearance: auto; }
    .form-select-sm { padding: .3rem .5rem; font-size: .82rem; border-radius: 6px; }
    .req { color: #dc2626; }

    /* ── Alertas ─────────────────────────────────────── */
    .alert {
      padding: .75rem 1rem;
      border-radius: 8px;
      font-size: .88rem;
      margin-bottom: 1rem;
    }
    .alert-danger  { background: #fee2e2; color: #991b1b; border-left: 3px solid #dc2626; }
    .alert-warning { background: #fef9c3; color: #854d0e; border-left: 3px solid #ca8a04; }
    .alert-info    { background: #dbeafe; color: #1e40af; border-left: 3px solid #2563eb; }
    .alert ul { margin: .5rem 0 0 1.25rem; }
    .alert li { margin: .2rem 0; }

    /* ── Toolbar y secciones ─────────────────────────── */
    .eval-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: .75rem;
    }
    .eval-toolbar h2 { font-size: 1.15rem; font-weight: 700; }
    .toolbar-actions { display: flex; gap: .5rem; align-items: center; }
    .eval-seccion {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .eval-seccion h3 { font-size: .95rem; font-weight: 700; margin-bottom: 1rem; color: #1e3a5f; }
    .eval-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      padding: 1rem 0;
      flex-wrap: wrap;
    }
    .eval-gh-actions {
      justify-content: space-between;
      align-items: flex-start;
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .gh-devolver { max-width: 400px; }

    /* ── Cabecera de evaluación ───────────────────────── */
    .eval-form-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .eval-subtitle { color: #64748b; font-size: .9rem; margin: .25rem 0; }
    .eval-fechas   { font-size: .85rem; color: #475569; margin: .2rem 0; }

    /* ── Resultado / índice ───────────────────────────── */
    .eval-resultado-box {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: #fff;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .resultado-indice {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }
    .resultado-label {
      font-size: .9rem;
      opacity: .85;
    }

    /* ── Tarjetas de competencia ─────────────────────── */
    .competencias-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    @media (min-width: 900px) {
      .competencias-grid { grid-template-columns: 1fr 1fr; }
    }
    .comp-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem;
      border: 2px solid #e2e8f0;
      transition: border-color .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .comp-card.comp-cumple  { border-color: #86efac; }
    .comp-card.comp-brecha  { border-color: #fca5a5; background: #fff8f8; }
    .comp-card-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .5rem;
      flex-wrap: wrap;
    }
    .comp-codigo {
      font-size: .75rem;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: .15em .5em;
      border-radius: 4px;
      white-space: nowrap;
    }
    .comp-nombre { font-weight: 600; font-size: .9rem; flex: 1; }
    .comp-definicion {
      font-size: .82rem;
      color: #64748b;
      margin-bottom: .75rem;
      line-height: 1.5;
    }
    .comp-opciones { display: flex; flex-direction: column; gap: .4rem; }
    .comp-opcion {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      padding: .6rem .75rem;
      border-radius: 7px;
      border: 1.5px solid #e2e8f0;
      cursor: pointer;
      transition: all .15s;
    }
    .comp-opcion:hover { border-color: #93c5fd; background: #eff6ff; }
    .comp-opcion.selected { border-color: #2563eb; background: #eff6ff; }
    .comp-opcion.readonly { cursor: default; }
    .comp-opcion input[type="radio"] { margin-top: .15rem; flex-shrink: 0; }
    .comp-opcion-inner { display: flex; flex-direction: column; gap: .2rem; flex: 1; }
    .grado-label { font-size: .75rem; font-weight: 700; color: #2563eb; }
    .conducta-texto { font-size: .82rem; color: #374151; line-height: 1.4; }
    .comp-evidencia {
      margin-top: .75rem;
      padding-top: .75rem;
      border-top: 1px dashed #e2e8f0;
    }
    .comp-evidencia label { font-size: .82rem; font-weight: 600; display: block; margin-bottom: .35rem; }
    .comp-evidencia small { font-weight: 400; color: #64748b; }

    /* ── Concepto periodo de prueba ───────────────────── */
    .concepto-opciones {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .concepto-btn {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .75rem 1.5rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
      transition: all .15s;
      flex: 1;
      max-width: 240px;
    }
    .concepto-btn:hover { border-color: #93c5fd; background: #eff6ff; }
    .concepto-btn.selected { border-color: #16a34a; background: #dcfce7; color: #166534; }
    .concepto-btn.selected.nocontinua { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
    .concepto-btn.readonly { cursor: default; }
    .concepto-btn input { pointer-events: none; }

    /* ── Plan de mejora ───────────────────────────────── */
    .plan-fila {
      background: #f8fafc;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: .75rem;
      border-left: 3px solid #fca5a5;
    }
    .plan-comp-nombre {
      font-weight: 600;
      font-size: .9rem;
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .plan-campos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .6rem;
    }
    .plan-campo label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: .2rem; color: #475569; }

    /* ── Firma ────────────────────────────────────────── */
    .firma-opciones { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .75rem; }
    .firma-opciones label { display: flex; align-items: center; gap: .5rem; font-size: .9rem; cursor: pointer; }

    /* ── Toasts ──────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1a2332;
      color: #fff;
      padding: .75rem 1.25rem;
      border-radius: 8px;
      font-size: .88rem;
      z-index: 9999;
      animation: slideUp .2s ease;
      max-width: 360px;
    }
    .toast-error   { background: #dc2626; }
    .toast-warning { background: #ca8a04; }
    @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    /* ── Loading y empty ─────────────────────────────── */
    .loading { padding: 3rem; text-align: center; color: #64748b; font-size: .9rem; }
    .empty-state { text-align: center; color: #94a3b8; padding: 2rem; }
    .error { color: #dc2626; padding: 1rem; background: #fee2e2; border-radius: 8px; }

    /* ── Utilitarios ─────────────────────────────────── */
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .text-muted { color: #64748b; font-size: .85rem; }
    .text-center { text-align: center; }
    .text-danger { color: #dc2626; }

    /* ── Responsive móvil ────────────────────────────── */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .content { padding: 1rem; }
      .eval-resultado-box { flex-direction: column; gap: .75rem; }
      .resultado-indice { font-size: 2.5rem; }
      .concepto-btn { max-width: 100%; }
      .eval-gh-actions { flex-direction: column; }
      .gh-devolver { max-width: 100%; }
    }

    /* ── Selector de identidad ───────────────────────── */
    .selector-identidad {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .selector-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .selector-icon { font-size: 3rem; margin-bottom: .75rem; }
    .selector-card h2 { font-size: 1.3rem; margin-bottom: .4rem; }
    .selector-lista {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      text-align: left;
    }
    .selector-grupo-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #94a3b8;
      margin: .75rem 0 .25rem;
    }
    .selector-usuario-btn {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: all .15s;
      width: 100%;
    }
    .selector-usuario-btn:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .selector-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .selector-nombre { font-weight: 600; font-size: .92rem; }
    .selector-cargo  { font-size: .8rem; }

    /* ── Formulario login ────────────────────────────── */
    .selector-form { margin-top: 1.5rem; display: flex; flex-direction: column; gap: .75rem; text-align: left; }
    .selector-campo label { font-size: .82rem; font-weight: 600; display: block; margin-bottom: .3rem; color: #475569; }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo">GH PRO</div>
    <div class="modulo">/ Evaluación de Desempeño</div>
    <div class="spacer"></div>
    <div id="eval-nav" style="display:flex;gap:.5rem;"></div>
  </div>

  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-label">Evaluaciones</div>
      <button class="nav-btn" onclick="EvalMod.mostrarBandeja()">📋 Bandeja</button>
      <button class="nav-btn" onclick="EvalMod.mostrarPeriodosPrueba()">⏱ Periodos de prueba</button>

      <div class="nav-label">Administración</div>
      <button class="nav-btn" onclick="EvalMod.mostrarParametros()">⚙ Parámetros</button>

      <div class="nav-label">Volver</div>
      <button class="nav-btn" onclick="window.location.href='index.html'">🏠 Inicio GH PRO</button>
    </div>

    <!-- Contenido principal -->
    <div class="content">
      <div id="eval-contenido">
        <div class="loading">Iniciando módulo de evaluación…</div>
      </div>
    </div>
  </div>
</div>

<!-- Supabase y lógica -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="evaluacion-app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    EvalMod.init();
  });
</script>
</body>
</html>
