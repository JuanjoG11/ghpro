<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Trabajador — GH Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #080d14;
      --bg2:      #0c1220;
      --card:     rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.08);
      --glow:     rgba(58,130,200,0.45);
      --accent:   #3a82c8;
      --accent2:  #c87c3a;
      --success:  #3aaa80;
      --danger:   #e05555;
      --warning:  #c87c3a;
      --tp:       #e8f0fa;
      --ts:       #8fa8c8;
      --tm:       #4a6080;
      --radius:   16px;
      --rsm:      10px;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--tp);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 60px;
    }
    @media (min-height: 700px) {
      body { justify-content: center; }
    }

    /* ── Orbs ── */
    .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb  { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.13; animation: floatOrb 20s infinite ease-in-out; }
    .o1 { width:500px;height:500px;background:var(--accent);top:-180px;left:-180px; }
    .o2 { width:350px;height:350px;background:var(--accent2);bottom:-80px;right:-80px;animation-delay:-8s; }
    @keyframes floatOrb {
      0%,100% { transform:translate(0,0) scale(1); }
      33%      { transform:translate(50px,-30px) scale(1.1); }
      66%      { transform:translate(-30px,50px) scale(0.9); }
    }

    /* ── Wrapper ── */
    .wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 32px;
      margin-top: 16px;
    }
    .logo-box {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 6px 24px rgba(58,130,200,0.35);
      margin-bottom: 16px;
    }
    .header h1 { font-size: 24px; font-weight: 800; }
    .header h1 span { background: linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .header p  { color: var(--ts); font-size: 14px; margin-top: 6px; }

    /* ── Card ── */
    .card {
      background: rgba(12,18,32,0.95);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .card + .card { margin-top: 16px; }

    /* ── Section title ── */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ts);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--ts);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--rsm);
      color: var(--tp);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--glow);
      box-shadow: 0 0 0 3px rgba(58,130,200,0.12);
      background: rgba(255,255,255,0.07);
    }
    input::placeholder, textarea::placeholder { color: var(--tm); }
    select option { background: #12122a; }
    textarea { resize: vertical; min-height: 80px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Campos de permiso — ocultos por defecto */
    .permiso-fields { display: none; }
    .permiso-fields.show { display: block; }

    /* ── Tipo de solicitud — botones visuales ── */
    .tipo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tipo-opcion {
      padding: 11px 12px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: var(--rsm);
      color: var(--ts);
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      text-align: left; font-family: inherit;
    }
    .tipo-opcion:hover {
      background: rgba(58,130,200,0.1);
      border-color: rgba(58,130,200,0.4);
      color: var(--tp);
    }
    .tipo-opcion.selected {
      background: rgba(58,130,200,0.18);
      border-color: var(--accent); color: var(--accent);
      box-shadow: 0 0 0 3px rgba(58,130,200,0.12);
    }
    .tipo-opcion[data-value="calamidad"] { grid-column: 1 / -1; }

    /* ── Toggle remunerado ── */
    .toggle-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--rsm);
    }
    .toggle-row label { margin: 0; text-transform: none; font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--tp); cursor: pointer; }
    input[type="checkbox"] {
      width: 20px; height: 20px; cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: var(--rsm);
      font-size: 14px; font-weight: 700;
      cursor: pointer; border: none; transition: all 0.25s;
      width: 100%;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #2a6aaa);
      color: #fff;
      box-shadow: 0 4px 18px rgba(58,130,200,0.3);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(58,130,200,0.45); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--ts);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: var(--tp); }

    /* ── Worker badge (after login) ── */
    .worker-badge {
      display: none;
      align-items: center; gap: 14px;
      padding: 16px 20px;
      background: rgba(58,130,200,0.1);
      border: 1px solid rgba(58,130,200,0.28);
      border-radius: var(--rsm);
      margin-bottom: 20px;
    }
    .worker-badge.show { display: flex; }
    .worker-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #2a6aaa);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; flex-shrink: 0;
      text-transform: uppercase;
    }
    .worker-name  { font-size: 15px; font-weight: 700; }
    .worker-cargo { font-size: 12px; color: var(--ts); margin-top: 2px; }
    .worker-change {
      margin-left: auto; font-size: 12px; color: var(--tm);
      cursor: pointer; text-decoration: underline;
      background: none; border: none; color: var(--ts);
      transition: color 0.2s;
    }
    .worker-change:hover { color: var(--tp); }

    /* ── Historial de solicitudes ── */
    .historial-item {
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--rsm);
      margin-bottom: 10px;
      background: rgba(255,255,255,0.025);
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }
    .historial-item::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 4px 0 0 4px;
    }
    .historial-item.status-en_proceso::before  { background: var(--accent); }
    .historial-item.status-aprobada::before    { background: var(--success); }
    .historial-item.status-no_aprobada::before { background: var(--danger); }

    .historial-item.status-aprobada {
      background: rgba(58,170,128,0.06);
      border-color: rgba(58,170,128,0.2);
    }
    .historial-item.status-no_aprobada {
      background: rgba(224,85,85,0.06);
      border-color: rgba(224,85,85,0.2);
    }
    .historial-item:last-child { margin-bottom: 0; }

    .hist-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 8px; flex-wrap: wrap;
    }
    .hist-tipo {
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .hist-fecha  { font-size: 12px; color: var(--tm); }
    .hist-detail { font-size: 13px; color: var(--ts); margin-bottom: 4px; }
    .hist-motivo { font-size: 12px; color: var(--ts); margin-top: 4px; font-style: italic; }

    /* Nota del admin */
    .hist-nota {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--rsm) var(--rsm) 0;
      font-size: 12px; color: var(--ts);
    }
    .hist-nota.aprobada    { border-left-color: var(--success); }
    .hist-nota.no_aprobada { border-left-color: var(--danger); }

    /* Banner de notificación de nuevo estado */
    .estado-banner {
      display: none;
      padding: 14px 18px;
      border-radius: var(--rsm);
      margin-bottom: 16px;
      font-size: 14px; font-weight: 600;
      animation: bannerPop 0.4s ease;
      align-items: center; gap: 12px;
    }
    .estado-banner.show { display: flex; }
    .estado-banner.aprobada    { background: rgba(58,170,128,0.15); border: 1px solid rgba(58,170,128,0.35); color: var(--success); }
    .estado-banner.no_aprobada { background: rgba(224,85,85,0.15);  border: 1px solid rgba(224,85,85,0.35);  color: var(--danger); }
    .estado-banner.en_proceso  { background: rgba(200,124,58,0.15); border: 1px solid rgba(200,124,58,0.35); color: var(--warning); }
    @keyframes bannerPop {
      from { transform: translateY(-8px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── Badges de estado ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge-solicitada { background: rgba(58,130,200,0.15); color: var(--accent); border: 1px solid rgba(58,130,200,0.3); }
    .badge-en_proceso { background: rgba(58,130,200,0.15); color: var(--accent); border: 1px solid rgba(58,130,200,0.3); }
    .badge-aprobada   { background: rgba(58,170,128,0.15); color: var(--success); border: 1px solid rgba(58,170,128,0.3); }
    .badge-rechazada  { background: rgba(224,85,85,0.15);  color: var(--danger);  border: 1px solid rgba(224,85,85,0.3); }
    .badge-no_aprobada{ background: rgba(224,85,85,0.15);  color: var(--danger);  border: 1px solid rgba(224,85,85,0.3); }
    .badge-en_curso   { background: rgba(200,124,58,0.15); color: var(--warning); border: 1px solid rgba(200,124,58,0.3); }
    .badge-finalizada { background: rgba(255,255,255,0.08); color: var(--tm); border: 1px solid var(--border); }

    /* ── Toast ── */
    .toast-wrap { position: fixed; bottom: 24px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: #1a1a35; border: 1px solid var(--border); border-radius: var(--rsm);
      padding: 14px 18px; min-width: 260px; max-width: 340px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s ease;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast-msg { font-size: 13px; color: var(--ts); flex: 1; }
    @keyframes slideIn { from { transform: translateX(80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 32px 16px; color: var(--tm); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
    .empty-text { font-size: 14px; color: var(--ts); }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      .card { padding: 22px 16px; }
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Orbs de fondo -->
<div class="orbs">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
</div>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="logo-box">🏢</div>
    <h1>Portal <span>Trabajador</span></h1>
    <p>Solicita tus vacaciones o permisos de forma rápida</p>
  </div>

  <!-- ══ PASO 1: Identificación ══ -->
  <div class="card" id="cardLogin">
    <div class="section-title">👤 Identificación</div>
    <div class="form-group">
      <label>Número de cédula</label>
      <input type="tel" id="inputCedula" placeholder="Ingresa tu número de cédula"
        autofocus autocomplete="off" inputmode="numeric" pattern="[0-9]*"
        onkeydown="if(event.key==='Enter') buscarTrabajador()">
    </div>
    <button class="btn btn-primary" id="btnBuscar" onclick="buscarTrabajador()">
      🚀 Entrar
    </button>
  </div>

  <!-- ══ PANEL principal (oculto hasta login) ══ -->
  <div id="panelPrincipal" style="display:none">

    <!-- Badge del trabajador -->
    <div class="worker-badge show" id="workerBadge" style="margin-top:16px">
      <div class="worker-avatar" id="workerAvatar">?</div>
      <div>
        <div class="worker-nombre" id="workerNombre">—</div>
        <div class="worker-cargo"  id="workerCargo">—</div>
      </div>
      <button class="worker-change" onclick="cerrarSesion()">Salir</button>
    </div>

    <!-- ══ FORMULARIO DE SOLICITUD ══ -->
    <div class="card">
      <div class="section-title">📝 Nueva Solicitud</div>

      <!-- Tipo de solicitud: Nivel 1 (Vacaciones o Permiso) -->
      <div class="form-group">
        <label>¿Qué deseas solicitar? *</label>
        <div class="tipo-grid" id="tipoGridPrincipal" style="grid-template-columns:1fr 1fr">
          <button type="button" class="tipo-opcion tipo-principal" data-value="vacaciones" onclick="seleccionarTipo(this)">
            🏖️ Vacaciones
          </button>
          <button type="button" class="tipo-opcion tipo-principal" data-value="permiso" onclick="seleccionarTipo(this)">
            🕐 Permiso
          </button>
        </div>
        <input type="hidden" id="solCategoria">
      </div>

      <!-- Subtipo de permiso (aparece solo cuando se selecciona Permiso) -->
      <div class="form-group" id="subtipoGroup" style="display:none">
        <label>Tipo de permiso *</label>
        <div class="tipo-grid" id="subtipoGrid" style="grid-template-columns:1fr 1fr">
          <button type="button" class="tipo-opcion subtipo-opcion" data-value="calamidad" onclick="seleccionarSubtipo(this)">
            🚨 Calamidad
          </button>
          <button type="button" class="tipo-opcion subtipo-opcion" data-value="licencia_remunerada" onclick="seleccionarSubtipo(this)">
            ✅ Lic. Remunerada
          </button>
          <button type="button" class="tipo-opcion subtipo-opcion" data-value="licencia_no_remunerada" onclick="seleccionarSubtipo(this)">
            📋 Lic. No Remunerada
          </button>
          <button type="button" class="tipo-opcion subtipo-opcion" data-value="permiso" onclick="seleccionarSubtipo(this)">
            🕐 Permiso por horas
          </button>
        </div>
        <input type="hidden" id="solTipo">
    <input type="hidden" id="solSubTipo">
      </div>

      <!-- Fechas (siempre visibles) -->
      <div class="row2">
        <div class="form-group">
          <label id="labelFechaInicio">Fecha de inicio *</label>
          <input type="date" id="solFechaInicio" oninput="onFechasChange()">
        </div>
        <div class="form-group">
          <label id="labelFechaFin">Fecha de fin *</label>
          <input type="date" id="solFechaFin" oninput="onFechasChange()">
        </div>
      </div>

      <!-- Resumen de días (solo vacaciones/licencias) -->
      <div id="resumenDias" style="display:none;margin-bottom:16px;
        padding:10px 14px;background:rgba(58,130,200,0.08);
        border:1px solid rgba(58,130,200,0.2);border-radius:var(--rsm);
        font-size:13px;color:var(--ts)">
        📅 Total: <strong id="textDias" style="color:var(--accent)">0 días</strong>
      </div>

      <!-- ══ Campos exclusivos de PERMISO ══ -->
      <div class="permiso-fields" id="permisoFields">
        <div class="row2">
          <div class="form-group">
            <label>Hora de inicio</label>
            <input type="time" id="solHoraInicio">
          </div>
          <div class="form-group">
            <label>Hora de fin</label>
            <input type="time" id="solHoraFin">
          </div>
        </div>

        <div class="form-group">
          <label>¿El permiso es remunerado?</label>
          <div class="toggle-row">
            <input type="checkbox" id="solRemunerado">
            <label for="solRemunerado" style="cursor:pointer">
              Sí, es un permiso remunerado
            </label>
          </div>
        </div>
      </div>

      <!-- Motivo (visible en permiso, calamidad y licencias) -->
      <div class="form-group" id="motivoGroup" style="display:none">
        <label id="labelMotivo">Motivo *</label>
        <textarea id="solMotivo" rows="3"
          placeholder="Describe brevemente el motivo de tu solicitud..."></textarea>
      </div>

      <!-- Observaciones opcionales -->
      <div class="form-group">
        <label>Observaciones adicionales</label>
        <textarea id="solObs" rows="2"
          placeholder="Cualquier información extra que quieras agregar..."></textarea>
      </div>

      <button class="btn btn-primary" id="btnEnviar" onclick="enviarSolicitud()">
        📤 Enviar Solicitud
      </button>
    </div>

    <!-- ══ HISTORIAL ══ -->
    <div class="card" id="cardHistorial" style="margin-top:16px">
      <div class="section-title">📋 Mis Solicitudes</div>

      <!-- Banner de cambio de estado en tiempo real -->
      <div class="estado-banner" id="estadoBanner">
        <span id="estadoBannerIcon" style="font-size:22px"></span>
        <div>
          <div id="estadoBannerTitulo" style="font-weight:700"></div>
          <div id="estadoBannerDesc" style="font-size:12px;opacity:0.85;margin-top:2px"></div>
        </div>
        <button onclick="document.getElementById('estadoBanner').classList.remove('show')"
          style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:18px;opacity:0.6;color:inherit">✕</button>
      </div>

      <div id="listaHistorial">
        <div class="empty">
          <div class="empty-icon">📋</div>
          <div class="empty-text">Cargando...</div>
        </div>
      </div>
    </div>

  </div><!-- /panelPrincipal -->

</div><!-- /wrapper -->

<!-- Toast container -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>

   CONFIGURACIÓN SUPABASE
   ============================================================ */

const { createClient } = supabase;

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
let trabajadorActual = null; // objeto con id, nombre, cedula, cargo

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, tipo = 'info', ms = 3500) {
  const iconos = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  const el = document.createElement('div');
  el.className = `toast ${tipo}`;
  el.innerHTML = `<span>${iconos[tipo] || 'ℹ️'}</span><span class="toast-msg">${msg}</span>`;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function fmtFecha(fecha) {
  if (!fecha) return '—';
  const [y, m, d] = fecha.split('-');
  return `${d}/${m}/${y}`;
}

function calcDias(ini, fin) {
  if (!ini || !fin) return 0;
  const d1 = new Date(ini), d2 = new Date(fin);
  if (d2 < d1) return 0;
  return Math.round((d2 - d1) / 86400000) + 1;
}

function tipoLabel(tipo) {
  const m = {
    vacaciones:             '🏖️ Vacaciones',
    permiso:                '🕐 Permiso',
    licencia_remunerada:    '✅ Lic. Remunerada',
    licencia_no_remunerada: '📋 Lic. No Remunerada',
    calamidad:              '🚨 Calamidad',
    otro:                   '📄 Otro',
  };
  return m[tipo] || tipo;
}

function statusBadge(status) {
  const labels = {
    en_proceso:  'En proceso',
    solicitada:  'En proceso',
    en_curso:    'En proceso',
    aprobada:    'Aprobada',
    finalizada:  'Aprobada',
    rechazada:   'Rechazada',
    no_aprobada: 'Rechazada',
  };
  const cls = (status === 'aprobada' || status === 'finalizada') ? 'aprobada'
            : (status === 'rechazada' || status === 'no_aprobada') ? 'rechazada'
            : 'en_curso';
  return `<span class="badge badge-${cls}">${labels[status] || status}</span>`;
}

function setBtn(id, loading) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) btn.innerHTML = `<span class="spinner"></span> Procesando...`;
}

/* ============================================================
   PASO 1 — BUSCAR TRABAJADOR POR CÉDULA
   ============================================================ */
async function buscarTrabajador() {
  const cedula = document.getElementById('inputCedula').value.trim();
  if (!cedula) { toast('Ingresa tu número de cédula', 'warning'); return; }

  setBtn('btnBuscar', true);
  document.getElementById('btnBuscar').innerHTML = `<span class="spinner"></span> Buscando...`;

  try {
    const { data, error } = await sb
      .from('trabajadores')
      .select('id, nombre, cedula, cargo, ciudad')
      .eq('cedula', cedula)
      .eq('estado', 'activo')
      .single();

    if (error || !data) {
      toast('Cédula no encontrada. Verifica el número o consulta con RRHH.', 'error', 5000);
      document.getElementById('btnBuscar').disabled = false;
      document.getElementById('btnBuscar').innerHTML = '🔍 Buscar';
      return;
    }

    trabajadorActual = data;
    mostrarPanel();
    cargarHistorial();

  } catch (e) {
    toast('Error de conexión. Intenta de nuevo.', 'error');
  } finally {
    const btn = document.getElementById('btnBuscar');
    if (btn) { btn.disabled = false; btn.innerHTML = '🔍 Buscar'; }
  }
}

/* ============================================================
   MOSTRAR PANEL PRINCIPAL
   ============================================================ */
function mostrarPanel() {
  const t = trabajadorActual;
  const iniciales = t.nombre.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

  document.getElementById('workerAvatar').textContent = iniciales;
  document.getElementById('workerNombre').textContent = t.nombre;
  document.getElementById('workerCargo').textContent  = `${t.cargo || 'Trabajador'} · ${t.ciudad || ''}`;

  document.getElementById('cardLogin').style.display     = 'none';
  document.getElementById('panelPrincipal').style.display = 'block';

  // Fecha mínima = hoy (usando fecha local, no UTC, para evitar desfase en Colombia UTC-5)
  const _d = new Date();
  const hoy = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
  document.getElementById('solFechaInicio').min = hoy;
  document.getElementById('solFechaFin').min    = hoy;

  // Suscribir realtime para notificar cambios de estado al trabajador
  suscribirCambiosEstado();
}

/* ============================================================
   CERRAR SESIÓN (volver al login)
   ============================================================ */
function cerrarSesion() {
  // Desuscribir canal realtime
  if (_realtimeChannel) { sb.removeChannel(_realtimeChannel); _realtimeChannel = null; }

  trabajadorActual = null;
  document.getElementById('inputCedula').value       = '';
  document.getElementById('cardLogin').style.display = '';
  document.getElementById('panelPrincipal').style.display = 'none';
  // Ocultar banner si estaba visible
  const banner = document.getElementById('estadoBanner');
  if (banner) banner.classList.remove('show');
  resetFormulario();
}

/* ============================================================
   LÓGICA DE TIPO DE SOLICITUD — botones visuales
   ============================================================ */
function seleccionarTipo(btn) {
  // Marcar botón activo
  document.querySelectorAll('.tipo-opcion').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Sincronizar input oculto
  document.getElementById('solTipo').value = btn.dataset.value;
  onTipoChange();
}

function seleccionarSubtipo(btn) {
  // Mark active sub‑type button
  document.querySelectorAll('.subtipo-opcion').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Store selected sub‑type
  document.getElementById('solSubTipo').value = btn.dataset.value;
}

function onTipoChange() {
  const tipo = document.getElementById('solTipo').value;

  // Campos de permiso
  const permisoFields = document.getElementById('permisoFields');
  const esPermiso = tipo === 'permiso';
  permisoFields.classList.toggle('show', esPermiso);

  // Clear sub‑tipo when not permiso
  if (!esPermiso) {
    document.getElementById('solSubTipo').value = '';
    document.querySelectorAll('.subtipo-opcion').forEach(b => b.classList.remove('selected'));
  }

  // Motivo obligatorio en: permiso, calamidad, licencias
  const subtipoGroup = document.getElementById('subtipoGroup');
  subtipoGroup.style.display = esPermiso ? 'block' : 'none';
  const necesitaMotivo = ['permiso', 'calamidad', 'licencia_remunerada', 'licencia_no_remunerada'].includes(tipo);
  const motivoGroup = document.getElementById('motivoGroup');
  motivoGroup.style.display = necesitaMotivo ? 'block' : 'none';

  // Etiqueta del motivo
  const etiquetas = {
    permiso:                 'Motivo del permiso *',
    calamidad:               'Describe la calamidad *',
    licencia_remunerada:     'Motivo de la licencia *',
    licencia_no_remunerada:  'Motivo de la licencia *',
  };
  document.getElementById('labelMotivo').textContent = etiquetas[tipo] || 'Motivo *';

  // Etiquetas de fecha
  const esSoloUnDia = tipo === 'permiso';
  document.getElementById('labelFechaInicio').textContent = esSoloUnDia ? 'Fecha del permiso *' : 'Fecha de inicio *';
  document.getElementById('labelFechaFin').textContent    = esSoloUnDia ? 'Fecha de fin' : 'Fecha de fin *';

  // Resumen días
  onFechasChange();
}

function onFechasChange() {
  const tipo = document.getElementById('solTipo').value;
  const ini  = document.getElementById('solFechaInicio').value;
  const fin  = document.getElementById('solFechaFin').value;
  const dias = calcDias(ini, fin);
  const resumen = document.getElementById('resumenDias');

  if (tipo && tipo !== 'permiso' && ini && fin && dias > 0) {
    resumen.style.display = 'block';
    document.getElementById('textDias').textContent =
      dias === 1 ? '1 día' : `${dias} días`;
  } else {
    resumen.style.display = 'none';
  }
}

/* ============================================================
   ENVIAR SOLICITUD
   ============================================================ */
async function enviarSolicitud() {
  const tipo      = document.getElementById('solTipo').value;
  const fechaIni  = document.getElementById('solFechaInicio').value;
  const fechaFin  = document.getElementById('solFechaFin').value;
  const motivo    = document.getElementById('solMotivo').value.trim();
  const obs       = document.getElementById('solObs').value.trim();
  const horaIni   = document.getElementById('solHoraInicio').value || null;
  const horaFin   = document.getElementById('solHoraFin').value   || null;
  const remunerado = document.getElementById('solRemunerado').checked;

  // Validaciones
  if (!tipo) { toast('Selecciona el tipo de solicitud', 'warning'); return; }
  if (!fechaIni) { toast('Indica la fecha de inicio', 'warning'); return; }

  // Para tipos que no son permiso, la fecha fin es obligatoria
  if (tipo !== 'permiso' && !fechaFin) {
    toast('Indica la fecha de fin', 'warning'); return;
  }
  // Si no hay fecha fin en permiso, usar misma fecha
  const fechaFinFinal = fechaFin || fechaIni;

  if (new Date(fechaFinFinal) < new Date(fechaIni)) {
    toast('La fecha de fin no puede ser anterior a la de inicio', 'warning'); return;
  }

  const necesitaMotivo = ['permiso', 'calamidad', 'licencia_remunerada', 'licencia_no_remunerada'].includes(tipo);
  if (necesitaMotivo && !motivo) {
    toast('El motivo es obligatorio para este tipo de solicitud', 'warning'); return;
  }

  const subtipo = document.getElementById('solSubTipo').value;
  const row = {
    trabajador_id:     trabajadorActual.id,
    trabajador_nombre: trabajadorActual.nombre,
    fecha_inicio:      fechaIni,
    fecha_fin:         fechaFinFinal,
    tipo: subtipo || tipo,
    status:            'en_proceso',
    observaciones:     obs || null,
    motivo:            motivo || null,
    hora_inicio:       tipo === 'permiso' ? horaIni : null,
    hora_fin:          tipo === 'permiso' ? horaFin  : null,
    es_remunerado:     tipo === 'permiso' ? remunerado : null,
    solicitado_en:     new Date().toISOString(),
  };

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Enviando...`;

  try {
    const { data, error } = await sb
      .from('vacaciones')
      .insert([row])
      .select()
      .single();

    if (error) {
      // Si los campos nuevos no existen aún (SQL no ejecutado), reintentar sin ellos
      if (error.message && error.message.includes('column')) {
        const rowBasico = {
          trabajador_id:     row.trabajador_id,
          trabajador_nombre: row.trabajador_nombre,
          fecha_inicio:      row.fecha_inicio,
          fecha_fin:         row.fecha_fin,
          tipo:              row.tipo,
          status:            row.status,
          observaciones:     [obs, motivo ? `Motivo: ${motivo}` : '', horaIni ? `Hora: ${horaIni}–${horaFin || '?'}` : '', tipo === 'permiso' ? (remunerado ? '✅ Remunerado' : '❌ No remunerado') : ''].filter(Boolean).join(' | ') || null,
        };
        const { error: e2 } = await sb.from('vacaciones').insert([rowBasico]);
        if (e2) { toast(`Error al enviar: ${e2.message}`, 'error', 6000); return; }
      } else {
        toast(`Error al enviar: ${error.message}`, 'error', 6000);
        return;
      }
    }

    toast('¡Solicitud enviada correctamente! 🎉 RRHH la revisará pronto.', 'success', 5000);
    resetFormulario();
    cargarHistorial();

  } catch (e) {
    toast('Error de conexión. Intenta de nuevo.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📤 Enviar Solicitud';
  }
}

/* ============================================================
   CARGAR HISTORIAL DEL TRABAJADOR
   ============================================================ */
async function cargarHistorial() {
  const lista = document.getElementById('listaHistorial');
  lista.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">Cargando...</div></div>`;

  try {
    const { data, error } = await sb
      .from('vacaciones')
      .select('*')
      .eq('trabajador_id', trabajadorActual.id)
      .order('created_at', { ascending: false })
      .limit(20);

    if (error) { lista.innerHTML = `<div class="empty"><div class="empty-text">No se pudo cargar el historial</div></div>`; return; }

    if (!data || data.length === 0) {
      lista.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Aún no tienes solicitudes registradas</div></div>`;
      return;
    }

    lista.innerHTML = data.map(v => _renderHistorialItem(v)).join('');

  } catch (e) {
    lista.innerHTML = `<div class="empty"><div class="empty-text">Error al cargar historial</div></div>`;
  }
}

function _renderHistorialItem(v) {
  const TIPO_LABEL = {
    vacaciones:             '🏖️ Vacaciones',
    permiso:                '🕐 Permiso',
    licencia_remunerada:    '✅ Lic. Remunerada',
    licencia_no_remunerada: '📋 Lic. No Remunerada',
    calamidad:              '🚨 Calamidad',
    otro:                   '📄 Otro',
  };
  const STATUS_INFO = {
    en_proceso:  { label: 'En proceso',   cls: 'badge-en_proceso',  icon: '⏳' },
    aprobada:    { label: 'Aprobada',     cls: 'badge-aprobada',    icon: '✅' },
    no_aprobada: { label: 'No aprobada',  cls: 'badge-no_aprobada', icon: '❌' },
  };

  const esPermiso = v.tipo === 'permiso';
  let detalle = '';
  if (esPermiso) {
    const horas = (v.hora_inicio && v.hora_fin) ? ` · ${v.hora_inicio.slice(0,5)}–${v.hora_fin.slice(0,5)}` : '';
    const rem   = v.es_remunerado === true ? ' · Remunerado' : v.es_remunerado === false ? ' · No remunerado' : '';
    detalle = `📅 ${fmtFecha(v.fecha_inicio)}${horas}${rem}`;
  } else {
    const dias = v.dias || calcDias(v.fecha_inicio, v.fecha_fin);
    detalle = `📅 ${fmtFecha(v.fecha_inicio)} → ${fmtFecha(v.fecha_fin)} · <strong>${dias} día${dias !== 1 ? 's' : ''}</strong>`;
  }

  const motivoHtml = v.motivo
    ? `<div class="hist-motivo">💬 ${v.motivo}</div>`
    : '';

  // Nota del admin (aprobado_por contiene la nota cuando se gestionó)
  const notaHtml = v.aprobado_por
    ? `<div class="hist-nota ${v.status}">📌 <strong>RRHH:</strong> ${v.aprobado_por}</div>`
    : '';

  const fechaSolicitud = v.solicitado_en || v.created_at
    ? new Date(v.solicitado_en || v.created_at).toLocaleDateString('es-CO', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      })
    : '';

  const st = STATUS_INFO[v.status] || { label: v.status, cls: 'badge-solicitada', icon: '•' };

  return `
    <div class="historial-item status-${v.status}" id="hist-item-${v.id}">
      <div class="hist-top">
        <div class="hist-tipo">${TIPO_LABEL[v.tipo] || v.tipo}</div>
        <span class="badge ${st.cls}">${st.icon} ${st.label}</span>
      </div>
      <div class="hist-detail">${detalle}</div>
      ${motivoHtml}
      ${notaHtml}
      <div class="hist-fecha" style="margin-top:8px">Solicitado: ${fechaSolicitud}</div>
    </div>`;
}

/* ============================================================
   REALTIME — escuchar cambios de estado en las solicitudes
   del trabajador actual para notificarle en vivo
   ============================================================ */
let _realtimeChannel = null;

function suscribirCambiosEstado() {
  if (_realtimeChannel) { sb.removeChannel(_realtimeChannel); }

  _realtimeChannel = sb.channel(`solicitudes-trabajador-${trabajadorActual.id}`)
    .on('postgres_changes', {
      event:  'UPDATE',
      schema: 'public',
      table:  'vacaciones',
      filter: `trabajador_id=eq.${trabajadorActual.id}`,
    }, (payload) => {
      const v = payload.new;
      _mostrarBannerEstado(v);
      // Actualizar la tarjeta específica en el historial sin recargar todo
      const item = document.getElementById(`hist-item-${v.id}`);
      if (item) {
        item.outerHTML = _renderHistorialItem(v);
      } else {
        // Si no existe aún (solicitud nueva), recargar todo el historial
        cargarHistorial();
      }
    })
    .subscribe();
}

function _mostrarBannerEstado(v) {
  const CONFIG = {
    aprobada:    { icon: '🎉', titulo: '¡Tu solicitud fue aprobada!',   cls: 'aprobada'    },
    finalizada:  { icon: '🎉', titulo: '¡Tu solicitud fue aprobada!',   cls: 'aprobada'    },
    rechazada:   { icon: '❌', titulo: 'Tu solicitud fue rechazada',    cls: 'rechazada'   },
    no_aprobada: { icon: '❌', titulo: 'Tu solicitud fue rechazada',    cls: 'rechazada'   },
    en_proceso:  { icon: '⏳', titulo: 'Tu solicitud está en proceso',  cls: 'en_curso'    },
    solicitada:  { icon: '⏳', titulo: 'Tu solicitud está en proceso',  cls: 'en_curso'    },
    en_curso:    { icon: '⏳', titulo: 'Tu solicitud está en proceso',  cls: 'en_curso'    },
  };
  const cfg = CONFIG[v.status];
  if (!cfg) return;

  const TIPO = {
    vacaciones: 'Vacaciones', permiso: 'Permiso',
    licencia_remunerada: 'Licencia Remunerada',
    licencia_no_remunerada: 'Licencia No Remunerada',
    calamidad: 'Calamidad',
  };

  const banner  = document.getElementById('estadoBanner');
  const bIcon   = document.getElementById('estadoBannerIcon');
  const bTitulo = document.getElementById('estadoBannerTitulo');
  const bDesc   = document.getElementById('estadoBannerDesc');
  if (!banner) return;

  bIcon.textContent   = cfg.icon;
  bTitulo.textContent = cfg.titulo;
  bDesc.textContent   = [
    TIPO[v.tipo] || v.tipo,
    v.fecha_inicio ? `· ${fmtFecha(v.fecha_inicio)}` : '',
    v.aprobado_por ? `· Nota: ${v.aprobado_por}` : '',
  ].filter(Boolean).join(' ');

  banner.className = `estado-banner show ${cfg.cls}`;

  // Scroll al banner para que el trabajador lo vea
  banner.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Ocultar automáticamente después de 12 segundos
  clearTimeout(banner._timeout);
  banner._timeout = setTimeout(() => banner.classList.remove('show'), 12000);
}

/* ============================================================
   RESET FORMULARIO
   ============================================================ */
function resetFormulario() {
  document.getElementById('solTipo').value          = '';
  document.querySelectorAll('.tipo-opcion').forEach(b => b.classList.remove('selected'));
  document.getElementById('solSubTipo').value = '';
  document.querySelectorAll('.subtipo-opcion').forEach(b => b.classList.remove('selected'));
  document.getElementById('solFechaInicio').value   = '';
  document.getElementById('solFechaFin').value      = '';
  document.getElementById('solHoraInicio').value    = '';
  document.getElementById('solHoraFin').value       = '';
  document.getElementById('solMotivo').value        = '';
  document.getElementById('solObs').value           = '';
  document.getElementById('solRemunerado').checked  = false;
  document.getElementById('permisoFields').classList.remove('show');
  document.getElementById('motivoGroup').style.display  = 'none';
  document.getElementById('resumenDias').style.display  = 'none';
}
</script>
